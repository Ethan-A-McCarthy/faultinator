<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Faultinator</title>
</head>
<body>

    <header>
        <h1 class="app-title">The Faultinator</h1>
        <p class="description">Rough frontend for the app but it will serve as a proof of concept until the backend is better and more accurate.</p>
    </header>

    <main>
        <section class="input-section">
            <h2>Input</h2>
            <textarea class="input-text" rows="10" cols="50" placeholder="Enter your text here..."></textarea>
            <br>
            <button class="process-button">Process</button>
        </section>

        <section class="output-section">
            <h2>Output</h2>
            <pre class="output-text"></pre>
        </section>

    </main>

</body>
</html>
