<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Faultinator</title>
</head>
<body>

    <header>
        <h1 class="app-title">The Faultinator</h1>
        <p class="description">Rough frontend for the app but it will serve as a proof of concept until the backend is better and more accurate.</p>
    </header>

    <main>
        <section class="search-section">
            <div class="search-box">
                <input id="summoner-input" type="text" placeholder="Summoner#TAG" />
                <select id="games-select">
                    <option value="1">1</option>
                    <option value="5" selected>5</option>
                    <option value="10">10</option>
                </select>
                <button id="search-button" onclick="runAnalysis()">Search</button>
            </div>
            <p class="search-hint">Enter Riot username and tag (e.g., Summoner#1234)</p>
        </section>

        <section id="results" class="results hidden"></section>
    </main>

    <script src="app.js"></script>

</body>
</html>
